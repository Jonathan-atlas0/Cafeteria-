version: '3.8'

# docker-compose.yml — Cafeteria (PHP + PostgreSQL + pgAdmin)

services:

  # ── Aplicação PHP (Cafeteria) ───────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: cafeteria_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - ./logs:/var/www/html/logs
    environment:
      DB_HOST:     db
      DB_USER:     cafeteria
      DB_PASS:     cafeteria123
      DB_NAME:     Cafeteria
      APP_ENV:     production
    depends_on:
      db:
        condition: service_healthy
    # Health Check do container — usa o endpoint /health.php (liveness)
    # Equivalente ao HEALTHCHECK do Dockerfile + liveness probe do Kubernetes
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health.php?live=1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - cafeteria_network

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16
    container_name: cafeteria_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       Cafeteria
      POSTGRES_USER:     cafeteria
      POSTGRES_PASSWORD: cafeteria123
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafeteria -d Cafeteria"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cafeteria_network


  # ── pgAdmin ─────────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cafeteria_pgadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@cafeteria.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    depends_on:
      - db
    networks:
      - cafeteria_network

volumes:
  db_data:
  vendor_data:

networks:
  cafeteria_network:
    driver: bridge
